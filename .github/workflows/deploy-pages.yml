name: Deploy Cubicus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:embed
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p dist
          cp index.html studio.html play.html dist/
          cp -r src dist/
          mkdir -p dist/node_modules/three/examples/jsm
          cp node_modules/three/LICENSE dist/node_modules/three/
          cp -r node_modules/three/build dist/node_modules/three/
          mkdir -p dist/node_modules/three/examples/jsm/controls dist/node_modules/three/examples/jsm/objects
          cp node_modules/three/examples/jsm/controls/OrbitControls.js dist/node_modules/three/examples/jsm/controls/
          cp node_modules/three/examples/jsm/objects/Reflector.js dist/node_modules/three/examples/jsm/objects/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages
