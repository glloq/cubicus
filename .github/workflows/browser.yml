name: Browser smoke
on:
  workflow_call:
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/cubicus-http.log 2>&1 &
          export CUBICUS_ARTIFACT_DIR=browser-artifacts
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-diagnostics
          path: browser-artifacts/
          if-no-files-found: ignore
