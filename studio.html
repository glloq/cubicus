<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubicus Studio</title><link rel="stylesheet" href="./src/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><header><strong>CUBICUS / Studio</strong><button id="save">Enregistrer projet</button><label>Ouvrir projet <input id="load" type="file" accept=".cubicus,.json"></label><button id="export">Exporter puzzle</button><button id="test">Tester</button></header><div class="layout"><aside><h3>Assemblage</h3><label>X <input id="nx" type="number" min="1" max="8" value="2"></label><label>Y <input id="ny" type="number" min="1" max="8" value="2"></label><label>Z <input id="nz" type="number" min="1" max="8" value="1"></label><button id="demo">Démo texturée</button><button id="generate">Générer grille</button><button id="add">Ajouter cube</button><details><summary>Bibliothèque de modèles</summary><button id="librarySave">Mémoriser cube</button><select id="library"></select><button id="libraryAdd">Ajouter modèle</button></details><button id="duplicate">Dupliquer</button><button id="remove">Supprimer</button><button id="shuffle">Mélanger</button><button id="reference">Mémoriser conception</button><button id="restore">Restaurer conception</button><details><summary>Outils du joueur</summary><div id="publicControls"></div></details><div id="controls"></div></aside><section id="view"></section><aside><h3>Face du cube</h3><div id="net" class="net"></div><select id="face"><option value="0">+X</option><option value="1">−X</option><option value="2">+Y</option><option value="3">−Y</option><option value="4">+Z</option><option value="5">−Z</option></select><canvas id="paint" width="512" height="512"></canvas><label>Image <input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Coul
